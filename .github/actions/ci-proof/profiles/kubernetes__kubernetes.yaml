# Profile: kubernetes/kubernetes, written from a shallow clone at fddd57cf (2026-10-11, ~/personal/k8s-src, read-only)
# for the D13 passive shadow of the Prow presubmit pull-kubernetes-unit. Selection unit = Go package directory.
repo: kubernetes/kubernetes
language: go
language_confidence: read
test_runner: go
# Makefile -> hack/make-rules/test.sh: gotestsum + `go test -json -timeout=180s` over every workspace package with tests
test_command: "make test"
test_command_confidence: read
setup:
  os_packages: []
  toolchain: "Go per .go-version (go1.27.x in the junit go.version property), linux/amd64, inside the Prow kubekins image"
  install: "none: go.work workspace (35 modules: k8s.io/kubernetes + staging/src/k8s.io/*), third-party code vendored in vendor/"
  pre_test: ""
  services: []
setup_confidence: read
# every top-level dir that holds Go packages (static map keys and their dependency dirs)
source_roots: [pkg, cmd, plugin, staging, test, third_party, cluster, hack, build]
# Go tests are co-located (_test.go next to the code): no separate test roots
test_roots: []
run_everything_when:
  # one module graph + vendored third-party code for every package: any change can affect every test binary
  - go.mod
  - go.sum
  - go.work
  - go.work.sum
  - .go-version
  - "vendor/**"
  - "staging/src/k8s.io/*/go.mod"
  - "staging/src/k8s.io/*/go.sum"
  # the test harness of the unit job itself
  - Makefile
  - build/root/Makefile
  - hack/make-rules/test.sh
  - "hack/lib/**"
run_everything_when_confidence: read
ignore:
  - "**/*.md"
  - "**/OWNERS"
  - OWNERS_ALIASES
  - "**/SECURITY_CONTACTS"
  - "**/LICENSE"
  - "LICENSES/**"
  - "CHANGELOG/**"
  - "docs/**"
  - "logo/**"
  - ".github/**"
  - "**/.gitignore"
  - "**/.gitattributes"
  # verify/update scripts and their configs run in pull-kubernetes-verify / -dependencies / -cmd, not in the unit job
  - "hack/*.sh"
  - "hack/*.yaml"
  - "hack/*.yaml.in"
  - "hack/*.conf"
  - "hack/*.json"
  - "hack/make-rules/verify.sh"
  - "hack/make-rules/update.sh"
  - "hack/testdata/**"
  - "hack/jenkins/**"
  - "hack/boilerplate/**"
  - "hack/e2e-internal/**"
  - "hack/gen-swagger-doc/**"
  # codegen violation lists (read by hack/update-codegen.sh / verify only)
  - "api/api-rules/**"
  # added after reading the FULL reasons of the last 7 days' diffs (2026-10-04..10, tuning set): files consumed by
  # other jobs only. No Go unit test reads them (grep of *.go at fddd57cf):
  - "test/integration/**"          # integration job; no unit test binary imports a test/integration package
  - "test/cmd/**"                  # shell suites of pull-kubernetes-cmd
  - "test/kubemark/**"             # kubemark scripts (dir removed before the map commit)
  - "test/**/*.sh"
  - "hack/**/*.sh"                 # hack/lib/** and hack/make-rules/test.sh stay FULL (run_everything_when is checked first)
  - "staging/publishing/**"        # publishing-bot rules (checked by hack/tools/publishing-verifier)
  - "staging/src/k8s.io/kms/internal/plugins/_mock/**"   # `_` dirs are ignored by the go tool
  - "test/declarative_validation/coverage-allowlist.yaml"   # no Go reader
ignore_confidence: guess
tooling_scopes:
  # data outside any package dir that unit tests read from disk by relative path (grep of *_test.go at fddd57cf)
  "test/fixtures/pkg/kubectl/**": "pkg/kubectl/"
  "api/openapi-spec/**":
    - staging/src/k8s.io/apimachinery/pkg/util/managedfields/
    - staging/src/k8s.io/apiserver/pkg/endpoints/
    - staging/src/k8s.io/client-go/openapi/
    - staging/src/k8s.io/client-go/openapi3/
    - staging/src/k8s.io/kubectl/
    - staging/src/k8s.io/cli-runtime/
  "api/discovery/**":
    - staging/src/k8s.io/client-go/discovery/
    - staging/src/k8s.io/kubectl/
    - staging/src/k8s.io/cli-runtime/
  "staging/src/k8s.io/cli-runtime/artifacts/**": staging/src/k8s.io/cli-runtime/
  "staging/src/k8s.io/kubectl/testdata/**": staging/src/k8s.io/kubectl/
  # separate Go modules outside the workspace (own junit files in the unit job; not in the static map)
  "hack/tools/**": hack/tools/
  # feature-gate reference lists: written/checked by test/compatibility_lifecycle/cmd (its unit tests use temp files)
  "test/compatibility_lifecycle/**": test/compatibility_lifecycle/
  # import-boss config files (cmd/import-boss reads them in the verify job)
  "**/.import-restrictions": cmd/import-boss/
  # code-generator examples: a nested module outside the workspace
  "staging/src/k8s.io/code-generator/examples/**": staging/src/k8s.io/code-generator/
  # cluster scripts: only cluster/gce/gci has unit tests (it executes configure-helper.sh from its own dir)
  "cluster/**": cluster/
tooling_scopes_confidence: guess
generated_files:
  # regenerated by hack/update-codegen.sh; .go ones are ordinary nodes of the import graph, the rest live in package dirs
  - "**/zz_generated.*.go"
  - "**/generated.pb.go"
  - "**/generated.proto"
  - "**/types_swagger_doc_generated.go"
  - "staging/src/k8s.io/client-go/applyconfigurations/**"
  - "staging/src/k8s.io/client-go/informers/**"
  - "staging/src/k8s.io/client-go/listers/**"
  - "staging/src/k8s.io/api/testdata/**"
  - "api/openapi-spec/**"
ci:
  provider: other
  workflow: "Prow presubmit pull-kubernetes-unit (prow.k8s.io; artifacts in gs://kubernetes-ci-logs/pr-logs/)"
  full_run_marker: "every run: `make test` runs all 1,510 workspace packages with tests (+ vendor and hack/tools modules)"
  test_jobs_regex: "^pull-kubernetes-unit$"
existing_selection: "none inside the job: every package is tested on every PR run (1,510 junit packages per run, measured). Whether Prow skips the job for docs-only PRs (skip_if_only_changed) was not checked (job config lives in kubernetes/test-infra, not opened)."
existing_selection_confidence: read
notes: "D13 step 2 (2026-10-11): static map experiments/k8s/build_go_map.py (go list -deps -test, GOOS=linux GOARCH=amd64 CGO_ENABLED=1, map commit fddd57cf); shadow experiments/k8s/. testdata/ dirs -> owning package and the packages below it (engine go runner)."
