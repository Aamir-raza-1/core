name: Revalidate 5x scenarios (DV8)

on:
  push:
    branches:
      - reval/5x
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/uv-cache
  APT_CACHE_VERSION: 1

jobs:
  revalidate:
    name: Revalidate 5 scenarios (home-assistant/core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache-apt-packages
        with:
          packages: bluez ffmpeg libturbojpeg libxml2-utils
          version: ${{ env.APT_CACHE_VERSION }}
          execute_install_scripts: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus0
      - id: info
        run: |
          echo "uv_version=$(grep '^uv==' requirements.txt | cut -d'=' -f3)" >> "$GITHUB_OUTPUT"
          echo "python_version=$(cat .python-version)" >> "$GITHUB_OUTPUT"
          echo "cache_key=trace-${{ hashFiles('requirements.txt', 'requirements_all.txt', 'requirements_test.txt', 'homeassistant/package_constraints.txt') }}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ steps.info.outputs.python_version }}
          uv-version: ${{ steps.info.outputs.uv_version }}
          python-cache-key: ${{ steps.info.outputs.cache_key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Run 5 scenarios (clean + planted bug)
        run: |
          . venv/bin/activate
          python3 -m script.translations develop --all > /dev/null
          mkdir -p out

          # Scenario 1: leaf component (homeassistant/components/pvoutput/sensor.py -> 4 test files)
          t0=$(python3 -c 'import time; print(time.time())')
          python3 -b -X dev -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml=out/s1.xml -o junit_family=legacy \
            tests/components/pvoutput/test_config_flow.py \
            tests/components/pvoutput/test_diagnostics.py \
            tests/components/pvoutput/test_init.py \
            tests/components/pvoutput/test_sensor.py > out/s1.txt 2>&1
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S1 sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 out/s1.txt)"

          # Scenario 4: test-only (tests/components/pvoutput/test_sensor.py -> 1 test file)
          t0=$(python3 -c 'import time; print(time.time())')
          python3 -b -X dev -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml=out/s4.xml -o junit_family=legacy \
            tests/components/pvoutput/test_sensor.py > out/s4.txt 2>&1
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S4 sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 out/s4.txt)"

          # Scenario 5: planted bug in homeassistant/components/pvoutput/sensor.py line 126 (negate-if)
          python3 -c '
          p = "homeassistant/components/pvoutput/sensor.py"
          txt = open(p).read()
          target = "if description.value_fn(coordinator.data) is not None:"
          assert target in txt
          open(p, "w").write(txt.replace(target, "if not (description.value_fn(coordinator.data) is not None):", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          python3 -b -X dev -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml=out/s5_selected.xml -o junit_family=legacy \
            tests/components/pvoutput/test_config_flow.py \
            tests/components/pvoutput/test_diagnostics.py \
            tests/components/pvoutput/test_init.py \
            tests/components/pvoutput/test_sensor.py > out/s5_selected.txt 2>&1
          rc_sel=$?
          set -e
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S5 rc_sel=$rc_sel sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 out/s5_selected.txt)"
          git checkout -- homeassistant/components/pvoutput/sensor.py
      - uses: actions/upload-artifact@v4
        with:
          name: reval-5x-ha
          path: out/
